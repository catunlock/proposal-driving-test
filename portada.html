<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Autoescuela Cari</title>
    <meta name="description" content="Examen de conducir · Edición especial">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%9A%97%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Caveat:wght@700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Portada pública: lo único que se ve sin contraseña. Al pulsar START se pide la matrícula (login.html)
         y después empieza el examen. El juego y las fotos siguen protegidos por middleware.js. -->
    <link rel="stylesheet" href="game/game.css">
    <style>
        body { background: linear-gradient(#5ec4ff 0%, #9ad9ff 45%, #d9f3ff 70%); }
        .scene { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
        .sun { position: absolute; right: 12vw; top: 9vh; width: 110px; height: 110px; border-radius: 50%; background: #fff3b0; box-shadow: 0 0 60px 20px rgba(255, 240, 170, .7); }
        .cloud { position: absolute; background: #fff; border-radius: 60px; opacity: .92; animation: drift linear infinite; }
        .cloud::before, .cloud::after { content: ''; position: absolute; background: #fff; border-radius: 50%; }
        .cloud::before { width: 55%; height: 140%; left: 12%; top: -60%; }
        .cloud::after { width: 40%; height: 120%; right: 14%; top: -45%; }
        .c1 { width: 180px; height: 48px; top: 14vh; animation-duration: 70s; }
        .c2 { width: 120px; height: 34px; top: 26vh; animation-duration: 95s; animation-delay: -40s; }
        .c3 { width: 220px; height: 56px; top: 8vh; animation-duration: 120s; animation-delay: -80s; }
        @keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }
        .hill { position: absolute; border-radius: 50% 50% 0 0; }
        .h1 { left: -10vw; right: 30vw; bottom: 14vh; height: 30vh; background: #7bd37b; }
        .h2 { left: 35vw; right: -15vw; bottom: 12vh; height: 26vh; background: #63c36a; }
        .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 18vh; background: #5bb35f; }
        .road { position: absolute; left: 0; right: 0; bottom: 5vh; height: 9vh; background: #4d5266; border-top: 6px solid #efe3c4; border-bottom: 6px solid #efe3c4; }
        .road::after { content: ''; position: absolute; left: 0; right: 0; top: calc(50% - 3px); height: 6px;
            background: repeating-linear-gradient(90deg, #ffd23f 0 40px, transparent 40px 80px); animation: dash 1.2s linear infinite; }
        @keyframes dash { to { background-position: -80px 0; } }
        .car { position: absolute; bottom: calc(5vh + 2.5vh); left: 0; font-size: 4.2rem; transform: scaleX(-1); animation: drive-by 9s ease-in-out infinite; }
        @keyframes drive-by { 0% { left: -12vw; } 55% { left: 62vw; } 70% { left: 62vw; } 100% { left: 112vw; } }
        .heart { position: absolute; font-size: 1.6rem; animation: float 6s ease-in-out infinite; opacity: .85; }
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-14px) rotate(6deg); } }
        #title-screen { opacity: 1; }
        #title-screen[hidden] { display: none !important; }
        .loading-note { margin-top: 12px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="scene" aria-hidden="true">
        <div class="sun"></div>
        <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
        <div class="hill h1"></div><div class="hill h2"></div>
        <div class="ground"></div>
        <div class="road"></div>
        <div class="car">🚗</div>
        <span class="heart" style="left: 20vw; top: 34vh">💗</span>
        <span class="heart" style="left: 78vw; top: 40vh; animation-delay: -2s">💞</span>
    </div>

    <section id="title-screen" class="overlay on">
        <div class="title-card">
            <div id="title-logo" class="title-logo" title="Autoescuela Cari">L</div>
            <h1 class="title">Autoescuela<br><span>Cari</span></h1>
            <p class="title-sub">Examen de conducir · Permiso B de <em>Bonita</em></p>
            <button id="btn-start" class="btn btn-big">START ▶</button>
            <div id="tesla-box" class="tesla-box" hidden>
                <p>🚘 <b>Unidad Tesla detectada.</b> Examen práctico disponible.</p>
                <div class="row">
                    <button id="btn-theater" class="btn btn-ghost">📺 Pantalla completa</button>
                    <button id="btn-continue-route" class="btn">🏁 Continuar ruta</button>
                </div>
            </div>
            <p id="note" class="loading-note" hidden></p>
        </div>
    </section>

    <script src="shared/car-browser.js"></script>
    <script>
        // START → si ya hay sesión, directo al examen; si no, a la matrícula-contraseña y después al examen
        async function go(kind) {
            const next = '/index.html?go=' + kind;
            const note = document.getElementById('note');
            note.hidden = false; note.textContent = 'Abriendo la autoescuela… 🚗💨';
            let ok = false;
            try { ok = (await (await fetch('/api/session', { credentials: 'same-origin' })).json()).ok; } catch (e) { /* sin servidor */ }
            location.href = ok ? next : '/login.html?next=' + encodeURIComponent(next);
        }
        const tesla = (typeof detectCarBrowser === 'function' && detectCarBrowser()) || new URLSearchParams(location.search).get('tesla') === 'true';
        if (tesla) { try { sessionStorage.setItem('isTesla', '1'); } catch (e) { /* ignorar */ } }
        const host = location.hostname;
        document.getElementById('tesla-box').hidden = !(tesla || host === 'localhost' || host === '127.0.0.1' || host.startsWith('192.168.'));
        document.getElementById('btn-start').onclick = () => go('start');
        document.getElementById('btn-continue-route').onclick = () => go('practical');
        document.getElementById('btn-theater').onclick = () => window.enterTeslaTheater && window.enterTeslaTheater();
        let taps = 0;
        document.getElementById('title-logo').onclick = () => { if (++taps >= 3) go('practical'); };
    </script>
</body>
</html>
